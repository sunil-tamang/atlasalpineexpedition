  description: Lhotse shares Everest Base Camp and much of the lower climbing route, but leaves the Everest
    line high on the Lhotse Face. Above the shared camps, its steep summit couloir makes the final ascent a
    distinct and demanding climb. The expedition includes an approach through the Khumbu, planned acclimatization
    rotations and an extended weather allowance.
  excerpt: Climb Lhotse from the Nepal side, sharing the lower Everest route before tackling the mountain’s
    steep upper face and summit couloir.
  video: null
  download: null
  image: null
  highlights:
  - content: Follow the Khumbu trail to Everest and Lhotse Base Camp
  - content: Share the Khumbu Icefall and Western Cwm approach with the Everest route
  - content: Climb fixed lines on the Lhotse Face during acclimatization rotations
  - content: Make a summit attempt through the Lhotse Couloir when conditions permit
  - content: Descend the mountain with the same care and resources used for the ascent
  overview:
  - content: At 8,516 metres, Lhotse is the fourth-highest mountain in the world. It sits immediately south
      of Everest, with commercial expeditions generally approaching from the Nepal-side Everest Base Camp.
  - content: Above the lower camps the line breaks away from the Everest route and rises toward the narrow
      Lhotse Couloir. Snow, ice, mixed terrain and extreme altitude make route conditions and weather decisive.
  - content: The sample plan allows time for progressive acclimatization and a flexible summit window; the
      final expedition schedule is confirmed on enquiry.
  itinerary:
  - title: Day 1 - Arrive in Kathmandu
    content: Meet the team and transfer to the expedition hotel.
  - title: Days 2-3 - Equipment and expedition briefing
    content: Review documents, equipment, oxygen plans and route logistics.
  - title: Day 4 - Fly to Lukla and trek to Phakding
    content: Begin the approach to the upper Khumbu.
  - title: Day 5 - Trek to Namche Bazaar
    content: Ascend from the Dudh Koshi valley to Namche.
  - title: Day 6 - Acclimatization in Namche
    content: Rest and walk higher before returning to sleep.
  - title: Day 7 - Trek to Tengboche or Deboche
    content: Continue past forests and monasteries beneath Ama Dablam.
  - title: Day 8 - Trek to Dingboche
    content: Follow the valley towards the high mountains.
  - title: Day 9 - Acclimatization in Dingboche
    content: Allow another day for adjustment to altitude.
  - title: Day 10 - Trek to Lobuche
    content: Continue along the Khumbu moraine.
  - title: Day 11 - Reach Everest and Lhotse Base Camp
    content: Settle into the shared base-camp area and review the climbing plan.
  - title: Days 12-18 - Base-camp training
    content: Prepare for fixed ropes, crevasse travel and high-camp rotations.
  - title: Days 19-34 - Acclimatization rotations
    content: Climb through the Icefall and Western Cwm towards the Lhotse Face, returning to recover between
      rotations.
  - title: Days 35-45 - Summit-weather window
    content: Advance through established camps, climb the upper Lhotse Face and attempt the summit couloir
      if conditions are safe.
  - title: Days 46-48 - Descend and clear base camp
    content: Return from the mountain, recover and pack the expedition camp.
  - title: Day 49 - Descend to Pheriche
    content: Begin the trek out of the upper Khumbu.
  - title: Day 50 - Trek to Namche Bazaar
    content: Continue downhill through Khumbu villages.
  - title: Day 51 - Trek to Lukla
    content: Complete the trail section.
  - title: Day 52 - Fly to Kathmandu
    content: Weather-dependent return flight and hotel transfer.
  - title: Day 53 - Contingency and debriefing
    content: Reserve time for delays and expedition debriefing.
  - title: Day 54 - International departure
    content: Airport transfer and onward journey.
