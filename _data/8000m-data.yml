      one of the commonly used expedition routes, reached through remote settlements and the Yalung approach
      valley.
  - content: The mountain demands a long supply chain, careful acclimatization and a conservatively planned
      summit push. Sections of steep snow, ice and mixed terrain can be serious at this altitude.
