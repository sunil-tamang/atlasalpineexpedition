  description: Everest rises above the Khumbu at 8,848.86 metres. Our proposed Nepal-side expedition follows
    the South Col and Southeast Ridge, beginning with the trek through Sherpa villages to Everest Base Camp.
    Acclimatization rotations, the Khumbu Icefall, the Lhotse Face and the final summit bid require a long
    weather window, a trained team and careful decisions throughout.
  excerpt: A Nepal-side Everest expedition by the South Col route, with a full Khumbu approach, staged acclimatization
    and a carefully managed summit window.
  video: null
  download: null
  image: null
  highlights:
  - content: Trek through Namche, Tengboche and the upper Khumbu to Everest Base Camp
  - content: Acclimatize progressively before moving through the Khumbu Icefall
  - content: Climb through the Western Cwm and onto the Lhotse Face
  - content: Follow the South Col and Southeast Ridge during a suitable summit window
  - content: Work with an experienced climbing team focused on preparation, communication and safe descent
  overview:
  - content: Mount Everest stands on the Nepal-China border and is approached from Nepal through the Khumbu
      Valley. The usual commercial Nepal-side line reaches the summit by the South Col and Southeast Ridge.
  - content: After reaching base camp, climbers spend several weeks training and completing rotations between
      established high camps. The schedule must remain flexible as icefall conditions, weather, acclimatization
      and team health govern progress.
  - content: The itinerary is a sample outline. Route support, oxygen arrangements, final dates and expedition
      services are confirmed directly with our team.
  itinerary:
  - title: Day 1 - Arrive in Kathmandu
    content: Airport reception, hotel transfer and introduction to the expedition team.
  - title: Days 2-3 - Briefings and final preparation
    content: Check personal equipment, review the route and complete permit and expedition briefings.
  - title: Day 4 - Fly to Lukla and trek to Phakding
    content: Travel to the Khumbu trailhead, subject to flight and weather conditions.
  - title: Day 5 - Trek to Namche Bazaar
    content: Follow the Dudh Koshi valley and ascend to the region’s main trading centre.
  - title: Day 6 - Acclimatization in Namche
    content: Rest and make a short acclimatization hike above the village.
  - title: Day 7 - Trek to Tengboche or Deboche
    content: Continue through the Khumbu with views of Everest, Lhotse and Ama Dablam.
  - title: Day 8 - Trek to Dingboche
    content: Move higher into the Imja valley and settle in for further acclimatization.
  - title: Day 9 - Acclimatization in Dingboche
    content: An active rest day, with a walk to a suitable viewpoint if conditions permit.
  - title: Day 10 - Trek to Lobuche
    content: Follow the upper Khumbu valley towards the glacier.
  - title: Day 11 - Arrive at Everest Base Camp
    content: Move to base camp, meet the mountain support team and settle into camp routines.
  - title: Days 12-18 - Base camp preparation
    content: Medical and equipment checks, rope systems practice and initial acclimatization.
  - title: Days 19-35 - High-camp rotations
    content: Make staged carries and acclimatization climbs via the Khumbu Icefall and Western Cwm; return
      to base camp between rotations.
  - title: Days 36-50 - Summit-weather window
    content: Subject to conditions, climb via Camp II, the Lhotse Face, Camp III and the South Col before the
      Southeast Ridge summit attempt and descent.
  - title: Days 51-53 - Recovery and camp clearing
    content: Return to base camp, recover and remove expedition equipment. Days may shift with weather.
  - title: Day 54 - Descend to Pheriche
    content: Leave base camp and walk down the Khumbu valley.
  - title: Day 55 - Trek to Namche Bazaar
    content: Continue through Pangboche and Tengboche towards Namche.
  - title: Day 56 - Trek to Lukla
    content: Finish the trail portion of the expedition.
  - title: Day 57 - Fly to Kathmandu
    content: Return to Kathmandu if mountain flight conditions permit.
  - title: Days 58-59 - Contingency and debriefing
    content: Allow time for flight delays, equipment sorting and expedition debriefing.
  - title: Day 60 - International departure
    content: Transfer to the airport for onward travel.
