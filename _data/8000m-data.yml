# 8000m-data.yml — SAMPLE CONTENT FOR ATLAS ALPINE EXPEDITION
# Eight internationally recognized 8000m peaks in Nepal / on its borders.
# Cho Oyu is classified as China because this listing assumes the usual Tibet-side route.
# All itineraries are illustrative planning outlines, not confirmed departures.
# Prices, permits, staffing, oxygen services, PDF links and exact dates must be confirmed.
# Fields intentionally left blank should not render a button or embedded asset.
# Dates/itinerary segments may shift significantly with weather, permits and conditions.
# Mountain heights may differ slightly across published Nepalese and international sources.

