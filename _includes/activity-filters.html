<form class="activity-filter-bar" id="expedition-filters" data-activity-filters data-default-region="{{ include.region }}"{% if include.expeditions %} data-default-altitude="8000" data-default-country="nepal"{% endif %} data-result-singular="{{ include.singular | default: 'Trip' }}" data-result-plural="{{ include.plural | default: 'Trips' }}">
 {% if include.expeditions %}<fieldset class="activity-altitude-pills"><legend class="visually-hidden">Altitude</legend>{% assign altitudes = 'all,8000,7000,6000' | split: ',' %}{% for altitude in altitudes %}<label><input type="radio" name="altitude" value="{{ altitude }}"{% if altitude == '8000' %} checked{% endif %}><span>{% if altitude == 'all' %}All Expeditions{% else %}{{ altitude }}m{% endif %}</span></label>{% endfor %}</fieldset>{% endif %}
 <div class="activity-filter-dropdown activity-duration-dropdown"><label class="visually-hidden" for="activity-duration">Duration</label><i class="far fa-calendar-alt" aria-hidden="true"></i><select name="duration" id="activity-duration"><option value="all" selected>All Durations</option><option value="up-to-7">Up to 7 days</option><option value="8-14">8–14 days</option><option value="15-21">15–21 days</option><option value="22-30">22–30 days</option><option value="31plus">31 days or more</option><option value="unknown">To be confirmed</option></select></div>
 {% if include.expeditions %}<div class="activity-filter-dropdown"><label class="visually-hidden" for="activity-country">Country</label><select name="country" id="activity-country"><option value="nepal" selected>Nepal</option><option value="pakistan">Pakistan</option><option value="china">China</option><option value="all">All Countries</option></select></div>{% endif %}
 <div class="activity-filter-dropdown"><label class="visually-hidden" for="activity-region">Region</label><select name="region" id="activity-region"><option value="all">All Regions</option><option value="{{ include.region }}" selected>{{ include.region | capitalize }}</option></select></div>
 <button class="activity-filter-clear" type="reset">Clear Filters</button>
</form>
