
# Atlas Alpine Expedition — Jekyll 4.4.x

title: "Atlas Alpine Expedition | Adventures and Tours in the Himalayas"
name: "Atlas Alpine Expedition"
email: atlasalpineexpedition@gmail.com

description: >-
  Nepal-based trekking, peak climbing, and Himalayan expeditions.
  Plan your mountain journey with Atlas Alpine Expedition.

url: "https://atlasalpineexpedition.com"
baseurl: ""

permalink: slug

# Collections
collections:
  gear-list:
    output: true

  team:
    output: true
    permalink: /team/:title

  activities:
    output: true
    permalink: /:title

  escape-trips:
    output: true
    permalink: /:title

  packages:
    output: false
    permalink: /:title

  treks:
    output: true
    permalink: /:title

  rafting:
    output: true
    permalink: /:title

  camping:
    output: true
    permalink: /:title

  paragliding:
    output: true
    permalink: /:title

  legal:
    output: true
    permalink: /legal/:name/

  renting:
    output: false
    permalink: /:title

  bike-tours:
    output: true
    permalink: /:title

  rock-climbing:
    output: true
    permalink: /:title

  peaks:
    output: true
    permalink: /activities/expeditions/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: activities
    values:
      layout: default
      image: true
      type: activities

# Excluded files
exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile.backup
  - Gemfile.lock.backup
  - Gemfile.lock.old
  - readme.md
  - license
  - CNAME
  - packages.html
  - _treks/assets
  - scripts
  - AGENTS.md

# Plugins
plugins:
  - jekyll-sitemap

# Front matter
strict_front_matter: true

# Sass Configuration
sass:
  sass_dir: _sass
  style: compressed

# HTML Compression
compress_html:
  clippings: all
  comments: all
  endings: []
  ignore:
    envs: []
  blanklines: false
  profile: false
  startings: []
